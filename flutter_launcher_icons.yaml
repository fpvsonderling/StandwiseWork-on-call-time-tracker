# App icons for every platform, drawn by tool/icon/make_icon.py.
# Regenerate: python3 tool/icon/make_icon.py && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  adaptive_icon_background: "#1E5F74"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/icon_macos.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  web:
    generate: false
