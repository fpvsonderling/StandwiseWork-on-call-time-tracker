name: standwise
description: "Work & on-call (standby) time tracker for teams — Flutter app with a Firebase backend."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  intl: ^0.20.3
  firebase_core: ^4.15.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.3
  http: ^1.6.0
  crypto: ^3.0.8
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^10.2.2
  fl_chart: ^1.3.0
  file_selector: ^1.1.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - docs/PRIVACY.md
    - docs/TERMS.md
