name: Apple check
on:
  push:
    branches: [claude/project-thread-0ptfhm]
    paths: [.github/workflows/apple-check.yml, tool/apple/**]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography
      - run: python tool/apple/asc_check.py
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
