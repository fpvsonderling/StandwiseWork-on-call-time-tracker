name: macOS signing setup

# One-time setup for the downloadable Mac app (D-049, docs/SETUP.md §12):
# creates the permanent Developer ID certificate and profile through the App
# Store Connect API and stores them as repository secrets. Needs the
# SECRETS_TOKEN secret (fine-grained token with "Secrets: read and write" on
# this repository). Nothing secret is printed.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Replace existing Developer ID secrets (creates a new certificate)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      GH_SECRETS_TOKEN: ${{ secrets.SECRETS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyjwt cryptography pynacl
      - name: Developer ID certificate and profile
        run: >-
          python tool/apple/asc.py devid-setup --bundle com.sonderling.standwise
          --repo "$GITHUB_REPOSITORY" ${{ inputs.force && '--force' || '' }}
